name: Offline audit checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify snapshot coverage, redaction patterns and file hashes
        run: python verify_deliverables.py --check-manifest
      - name: Reproduce frontend findings without network calls
        run: node frontend-repros/run.mjs
      - name: Test the index monitor with mocked responses
        run: python -m unittest discover -s daily-index-monitor -v
